  <script>
    (function () {
      try { localStorage.removeItem('robotics_portal_pass_v1'); } catch (e) {}
      const STORAGE_KEY = "agentbus_explainer_pass_v2";
      const shell = document.getElementById('portal-lock-shell');
      const form = document.getElementById('portal-unlock-form');
      const passInput = document.getElementById('portal-pass-input');
      const toggleBtn = document.getElementById('portal-toggle-vis');
      const rememberBox = document.getElementById('portal-remember');
      const submitBtn = document.getElementById('portal-submit-btn');
      const errBox = document.getElementById('portal-error');
      const iframe = document.getElementById('portal-frame');
      const lockPill = document.getElementById('portal-lock-pill');
      const payloadEl = document.getElementById('portal-enc-payload');

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function decryptEnvelope(env, passphrase) {
        if (!window.crypto || !window.crypto.subtle) {
          throw new Error('NO_WEBCRYPTO');
        }
        if (!env || env.v !== 1 || env.alg !== 'PBKDF2-SHA256-AES256-GCM') {
          throw new Error('BAD_ENVELOPE');
        }
        const enc = new TextEncoder();
        const salt = b64ToBytes(env.salt);
        const iv = b64ToBytes(env.iv);
        const ct = b64ToBytes(env.ct);
        const baseKey = await window.crypto.subtle.importKey(
          'raw',
          enc.encode(passphrase),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        const key = await window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: Number(env.iter) || 200000, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const plainBuf = await window.crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          ct
        );
        return new TextDecoder('utf-8').decode(plainBuf);
      }

      function lockPortal() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        iframe.srcdoc = '';
        iframe.hidden = true;
        lockPill.hidden = true;
        shell.hidden = false;
        passInput.value = '';
        errBox.textContent = '';
        passInput.focus();
      }

      async function refreshEncryptedFeed(passphrase) {
        const feedUrl = document.body.getAttribute('data-state-feed') || '';
        if (!feedUrl) return;
        try {
          const sep = feedUrl.indexOf('?') >= 0 ? '&' : '?';
          const resp = await fetch(feedUrl + sep + '_ts=' + Date.now(), { cache: 'no-store' });
          if (!resp.ok) return;
          const env = await resp.json();
          const stateText = await decryptEnvelope(env, passphrase);
          const stateObj = JSON.parse(stateText);
          const applyFn = iframe.contentWindow && iframe.contentWindow.applyImportedDashboardState;
          if (typeof applyFn === 'function') {
            applyFn(stateObj, '加密状态源');
          }
        } catch (e) {}
      }

      async function unlockWithPassphrase(passphrase, opts) {
        const isCached = Boolean(opts && opts.fromCache);
        errBox.textContent = '';
        submitBtn.disabled = true;
        try {
          const env = JSON.parse(payloadEl.textContent || '{}');
          const htmlText = await decryptEnvelope(env, passphrase);
          if (isCached || rememberBox.checked) {
            try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (e) {}
          }
          iframe.onload = function () { refreshEncryptedFeed(passphrase); };
          iframe.srcdoc = htmlText;
          shell.hidden = true;
          iframe.hidden = false;
          lockPill.hidden = false;
        } catch (err) {
          if (isCached) {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          }
          if (err && err.message === 'NO_WEBCRYPTO') {
            errBox.textContent = '当前浏览器不支持 WebCrypto（请使用 HTTPS 打开页面）';
          } else {
            errBox.textContent = isCached ? '已缓存口令已失效，请重新输入访问口令' : '访问口令错误或密文损坏，请重试';
          }
        } finally {
          submitBtn.disabled = false;
        }
      }

      toggleBtn.addEventListener('click', function () {
        const hidden = passInput.type === 'password';
        passInput.type = hidden ? 'text' : 'password';
        toggleBtn.textContent = hidden ? '隐藏' : '显示';
      });

      lockPill.addEventListener('click', lockPortal);

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        const val = passInput.value.trim();
        if (!val) {
          errBox.textContent = '请输入访问口令';
          return;
        }
        unlockWithPassphrase(val, { fromCache: false });
      });

      try {
        const cachedPass = localStorage.getItem(STORAGE_KEY);
        if (cachedPass) {
          unlockWithPassphrase(cachedPass, { fromCache: true });
        }
      } catch (e) {}
    })();
  </script>
